name: Manual Macro Briefing Pipeline

on:
  workflow_dispatch:
    inputs:
      send_mail:
        description: "Send Gmail after pipeline"
        required: true
        default: true
        type: boolean
      recipients_override:
        description: "Optional RECIPIENTS override (comma-separated emails)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: manual-macro-briefing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-manual-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TE_COOKIES: ${{ secrets.TE_COOKIES }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      SENDER_MAIL: ${{ secrets.SENDER_MAIL }}
      GOOGLE_PASSWORD: ${{ secrets.GOOGLE_PASSWORD }}
      RECIPIENTS: ${{ secrets.RECIPIENTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r GHA_Manual_Briefing_Pipeline/requirements_macro.txt
          pip install -r GHA_Manual_Briefing_Pipeline/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Apply recipients override
        if: ${{ inputs.recipients_override != '' }}
        run: |
          SANITIZED_RECIPIENTS="$(printf '%s' "${{ inputs.recipients_override }}" | tr -d '\r\n')"
          echo "RECIPIENTS=${SANITIZED_RECIPIENTS}" >> "$GITHUB_ENV"

      - name: Run manual pipeline (send mail)
        if: ${{ inputs.send_mail }}
        run: |
          python GHA_Manual_Briefing_Pipeline/run_pipeline.py \
            --send-mail

      - name: Run manual pipeline (dry-run mail)
        if: ${{ !inputs.send_mail }}
        run: |
          python GHA_Manual_Briefing_Pipeline/run_pipeline.py \
            --dry-run-mail

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-briefing-output
          if-no-files-found: warn
          path: |
            GHA_Manual_Briefing_Pipeline/app/Calendar/economic_calendar_*.csv
            GHA_Manual_Briefing_Pipeline/app/Macro_News_Briefing/briefing_result.json
            GHA_Manual_Briefing_Pipeline/output/email_preview.html
