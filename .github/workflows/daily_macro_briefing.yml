name: Daily Macro Briefing

on:
  schedule:
    # 07:00 KST every day (22:00 UTC previous day)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-macro-briefing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TE_COOKIES: ${{ secrets.TE_COOKIES }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      SENDER_MAIL: ${{ secrets.SENDER_MAIL }}
      GOOGLE_PASSWORD: ${{ secrets.GOOGLE_PASSWORD }}
      RECIPIENTS: ${{ secrets.RECIPIENTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r GHA_Manual_Briefing_Pipeline/requirements_macro.txt
          pip install -r GHA_Manual_Briefing_Pipeline/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run daily pipeline
        run: |
          python GHA_Manual_Briefing_Pipeline/run_pipeline.py --send-mail

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-macro-briefing-output
          if-no-files-found: warn
          path: |
            GHA_Manual_Briefing_Pipeline/app/Calendar/economic_calendar_*.csv
            GHA_Manual_Briefing_Pipeline/app/Macro_News_Briefing/briefing_result.json
            GHA_Manual_Briefing_Pipeline/output/email_preview.html
